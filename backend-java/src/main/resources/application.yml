server:
  port: ${PORT:8080}

spring:
  application:
    name: backend-java
  mvc:
    problemdetails:
      enabled: false
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/knowledge}
    username: ${DB_USERNAME:knowledge}
    password: ${DB_PASSWORD:local_dev_only_change_me}
    hikari:
      connection-timeout: 3000
      maximum-pool-size: 5
  flyway:
    enabled: true
    locations: classpath:db/migration

rag:
  base-url: ${RAG_BASE_URL:http://localhost:8000}
  connect-timeout: ${RAG_CONNECT_TIMEOUT:2s}
  read-timeout: ${RAG_READ_TIMEOUT:10s}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  level:
    com.company.knowledge: INFO
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{traceId:-no-trace}] %logger{36} - %msg%n"

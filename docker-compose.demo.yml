name: workmesh-demo

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ekr-postgres-demo
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-knowledge}
      POSTGRES_USER: ${POSTGRES_USER:-knowledge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_only_change_me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata_demo:/var/lib/postgresql/data
      - ./infra/docker/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-knowledge} -d ${POSTGRES_DB:-knowledge}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - mesh-network

  workmesh-api:
    build:
      context: .
      dockerfile: rag-python/Dockerfile
    container_name: workmesh-api-demo
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-knowledge}:${POSTGRES_PASSWORD:-local_dev_only_change_me}@postgres:5432/${POSTGRES_DB:-knowledge}
      POSTGRES_USER: ${POSTGRES_USER:-knowledge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_only_change_me}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-knowledge}
      # =======================================================================
      # SECURITY WARNING: DEMO ONLY — NOT SAFE FOR PRODUCTION!
      # AUTH_MODE=dev disables mandatory JWT verification so Quick Start curl
      # examples work with X-User-* simulation headers. For real deployments,
      # set AUTH_MODE=prod and supply a 32+ character JWT_SECRET.
      # =======================================================================
      AUTH_MODE: dev
      EMBEDDING_PROVIDER: sentence-transformers
      EMBEDDING_MODEL: sentence-transformers/all-MiniLM-L6-v2
      EMBEDDING_DIMENSION: 384
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data:ro
      - ./demo-ui:/app/demo-ui:ro
    command:
      - sh
      - -c
      - "python -m app.cli.ingest --source all && exec uvicorn app.main:app --host 0.0.0.0 --port 8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mesh-network

networks:
  mesh-network:
    driver: bridge

volumes:
  pgdata_demo:
